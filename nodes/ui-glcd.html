<script type="text/javascript">
    RED.nodes.registerType('ui-glcd', {
        category: RED._('@flowfuse/node-red-dashboard/ui-base:ui-base.label.category'),
        color: RED._('@flowfuse/node-red-dashboard/ui-base:ui-base.colors.light'),
        defaults: {
            name: { value: "" },
            group: { type: 'ui-group', required: true },
            order: { value: 0 },
            width: {
                value: 0,
                validate: function (v) {
                    const width = v || 0
                    const currentGroup = $('#node-input-group').val() || this.group
                    const groupNode = RED.nodes.node(currentGroup)
                    const valid = !groupNode || +width <= +groupNode.width
                    $('#node-input-size').toggleClass('input-error', !valid)
                    return valid
                }
            },
            height: { value: 0 },

            label: { value: "Graphic LCD" },
            lcd_width: { value: 128 },
            lcd_height: { value: 64 },
            grayscale: { value: false },
            pixel_size: { value: 2 },
            space_size: { value: 1 },
            backlight_color: { value: "#ccdd22" },
            pixel_color: { value: "#474d0b" },
            use_block_color: { value: false },
            block_color: { value: "#000000" },
            backlight: { value: true },
            bright: { value: 1 },
            dim: { value: 0.4 },
            contrast: { value: 0.5 },
            auto_clear: { value: true },
            rom: { value: "eu" },
            transitionDuration: { value: 0 }
        },
        inputs: 1,
        outputs: 0,
        icon: "font-awesome/fa-picture-o",
        label: function() {
            return this.name || "Graphic LCD";
        },
        oneditprepare: function () {
            $('#node-input-size').elementSizer({
                width: '#node-input-width',
                height: '#node-input-height',
                group: '#node-input-group'
            });
            $('#node-input-backlight_color').val(this.backlight_color || "#ccdd22");
            $('#node-input-pixel_color').val(this.pixel_color || "#474d0b");
            $('#node-input-block_color').val(this.block_color || "#000000");
            $('#node-input-use_block_color').on('change', function () {
                $('#node-input-block_color').toggle(this.checked);
            }).trigger('change');
        }
    });
</script>

<script type="text/html" data-template-name="ui-glcd">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-group"><i class="fa fa-table"></i> Group</label>
        <input type="text" id="node-input-group">
    </div>
    <div class="form-row">
        <label><i class="fa fa-object-group"></i> Size</label>
        <input type="hidden" id="node-input-width">
        <input type="hidden" id="node-input-height">
        <button class="editor-button" id="node-input-size"></button>
    </div>
    <div class="form-row">
        <label for="node-input-label"><i class="fa fa-font"></i> Label</label>
        <input type="text" id="node-input-label">
    </div>
    <div class="form-row">
        <label for="node-input-lcd_width"><i class="fa fa-arrows-h"></i> Width (pixels)</label>
        <input type="number" id="node-input-lcd_width" min="1" value="128">
    </div>
    <div class="form-row">
        <label for="node-input-lcd_height"><i class="fa fa-arrows-v"></i> Height (pixels)</label>
        <input type="number" id="node-input-lcd_height" min="1" value="64">
    </div>
    <div class="form-row">
        <label for="node-input-grayscale"><i class="fa fa-adjust"></i> Grayscale</label>
        <input type="checkbox" id="node-input-grayscale">
    </div>
    <div class="form-row">
        <label for="node-input-pixel_size"><i class="fa fa-th-large"></i> Pixel Size</label>
        <input type="number" id="node-input-pixel_size" min="1" value="2">
    </div>
    <div class="form-row">
        <label for="node-input-space_size"><i class="fa fa-arrows-h"></i> Space Size</label>
        <input type="number" id="node-input-space_size" min="0" value="1">
    </div>
    <div class="form-row">
        <label for="node-input-backlight_color"><i class="fa fa-lightbulb-o"></i> Backlight Color</label>
        <input type="color" id="node-input-backlight_color" value="#ccdd22">
    </div>
    <div class="form-row">
        <label for="node-input-pixel_color"><i class="fa fa-paint-brush"></i> Pixel Color</label>
        <input type="color" id="node-input-pixel_color" value="#474d0b">
    </div>
    <div class="form-row">
        <label for="node-input-use_block_color"><i class="fa fa-square"></i> Block Color</label>
        <input type="checkbox" id="node-input-use_block_color" style="width: auto; vertical-align: middle;">
        <input type="color" id="node-input-block_color" value="#000000">
    </div>
    <div class="form-row">
        <label for="node-input-backlight"><i class="fa fa-power-off"></i> Backlight On</label>
        <input type="checkbox" id="node-input-backlight" checked>
    </div>
    <div class="form-row">
        <label for="node-input-bright"><i class="fa fa-sun-o"></i> Brightness</label>
        <input type="number" id="node-input-bright" min="0" max="1" step="0.05" value="1">
    </div>
    <div class="form-row">
        <label for="node-input-dim"><i class="fa fa-moon-o"></i> Dim</label>
        <input type="number" id="node-input-dim" min="0" max="1" step="0.05" value="0.4">
    </div>
    <div class="form-row">
        <label for="node-input-contrast"><i class="fa fa-adjust"></i> Contrast</label>
        <input type="number" id="node-input-contrast" min="0" max="1" step="0.05" value="0.5">
    </div>
    <div class="form-row">
        <label for="node-input-auto_clear"><i class="fa fa-trash"></i> Auto Clear</label>
        <input type="checkbox" id="node-input-auto_clear" checked>
    </div>
    <div class="form-row">
        <label for="node-input-rom"><i class="fa fa-font"></i> ROM</label>
        <select id="node-input-rom">
            <option value="eu" selected>EU</option>
            <option value="jp">JP</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-transitionDuration"><i class="fa fa-clock-o"></i> Transition Duration</label>
        <input type="number" id="node-input-transitionDuration" min="0" value="0">
    </div>
</script>
